<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>請假審核</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E8DCC3;
    --paper-deep: #DED0B3;
    --ink: #2B2420;
    --ink-soft: #6B5F4F;
    --chop: #A6331F;
    --chop-deep: #7E2517;
    --gold: #8C6A2F;
    --moss: #5C6E49;
    --line: #C9BBA0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 16px 80px;
  }
  .wrap{ width:100%; max-width:560px; }
  header{ text-align:center; margin-bottom:22px; }
  h1{ font-family:'Noto Serif TC', serif; font-size:24px; margin:0 0 6px; letter-spacing:1px; }
  .subtitle{ font-size:13px; color: var(--ink-soft); margin:0; }
  .notice{
    font-size:12px;
    color: var(--chop-deep);
    text-align:center;
    background: rgba(166,51,31,0.08);
    border:1px solid rgba(166,51,31,0.25);
    border-radius:6px;
    padding:8px 12px;
    margin:14px 0 26px;
  }
  .toolbar{ display:flex; justify-content:center; margin-bottom:20px; }
  .toolbar button{
    background: var(--paper-deep);
    border:1px solid var(--line);
    color: var(--ink);
    padding:8px 18px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
  }
  .section-title{
    font-family:'Noto Serif TC', serif;
    font-size:15px;
    margin:0 0 12px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .list{ display:flex; flex-direction:column; gap:10px; margin-bottom:32px; }
  .empty{ font-size:13px; color: var(--ink-soft); text-align:center; padding:16px 0; }
  .req-card{
    background: var(--paper-deep);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
  }
  .req-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:6px; }
  .req-name{ font-weight:600; font-size:14px; }
  .req-date{ font-size:12px; color: var(--ink-soft); }
  .req-reason{ font-size:13px; color: var(--ink); margin:0 0 10px; line-height:1.5; }
  .req-meta{ font-size:11px; color: var(--ink-soft); margin-bottom:10px; }
  .req-actions{ display:flex; gap:8px; }
  .req-actions button{
    flex:1;
    border:none;
    padding:8px 10px;
    border-radius:5px;
    font-size:13px;
    cursor:pointer;
    font-family:'Noto Sans TC', sans-serif;
  }
  .btn-approve{ background: var(--moss); color: #fff; }
  .btn-reject{ background: transparent; color: var(--chop-deep); border:1px solid var(--chop-deep) !important; }
  .tag{ font-size:10px; padding:2px 8px; border-radius:10px; }
  .tag.approved{ background: rgba(92,110,73,0.15); color: var(--moss); }
  .tag.rejected{ background: rgba(166,51,31,0.12); color: var(--chop-deep); }
  .history-item{
    background: rgba(255,255,255,0.15);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 14px;
    font-size:12px;
    color: var(--ink-soft);
  }
  .history-item .top{ display:flex; justify-content:space-between; margin-bottom:4px; }
  .history-item .name{ color: var(--ink); font-weight:600; }
  .history-note{ margin-top:4px; color: var(--chop-deep); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>請假審核</h1>
    <p class="subtitle">管理者頁面 · 每日簽到系統</p>
  </header>

  <p class="notice">資料儲存在 Cloudflare D1,需要管理者密碼才能查看與審核請假申請。</p>

  <div class="toolbar"><button id="refreshBtn">重新整理</button></div>

  <p class="section-title">待審核</p>
  <div class="list" id="pendingList"></div>

  <p class="section-title">審核紀錄</p>
  <div class="list" id="historyList"></div>
</div>

<script>
const ADMIN_PASSWORD_KEY = 'leave-admin-password';
let adminPassword = sessionStorage.getItem(ADMIN_PASSWORD_KEY) || '';

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function api(path, options = {}, canRetry = true){
  if(!adminPassword){
    adminPassword = prompt('請輸入管理者密碼:') || '';
    if(!adminPassword) throw new Error('未輸入管理者密碼');
    sessionStorage.setItem(ADMIN_PASSWORD_KEY, adminPassword);
  }
  const headers = new Headers(options.headers || {});
  headers.set('Content-Type', 'application/json');
  headers.set('X-Admin-Password', adminPassword);
  const res = await fetch(path, { ...options, headers });
  if(res.status === 401 && canRetry){
    sessionStorage.removeItem(ADMIN_PASSWORD_KEY);
    adminPassword = '';
    alert('管理者密碼錯誤,請重新輸入。');
    return api(path, options, false);
  }
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.error || '伺服器錯誤');
  return data;
}

function fmtTime(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('sv-SE') + ' ' + d.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
  }catch(e){ return iso || ''; }
}

async function getRequests(){
  const data = await api('/api/admin/requests');
  return data.requests || [];
}

async function render(){
  const pendingList = document.getElementById('pendingList');
  const historyList = document.getElementById('historyList');
  pendingList.innerHTML = '<div class="empty">載入中...</div>';
  historyList.innerHTML = '';
  try{
    const list = await getRequests();
    const pending = list.filter(r => r.status === 'pending').sort((a,b) => (a.submittedAt||'').localeCompare(b.submittedAt||''));
    const history = list.filter(r => r.status !== 'pending').sort((a,b) => (b.reviewedAt||'').localeCompare(a.reviewedAt||''));

    pendingList.innerHTML = '';
    if(pending.length === 0){
      pendingList.innerHTML = '<div class="empty">目前沒有待審核的請假申請</div>';
    }else{
      pending.forEach(r => {
        const card = document.createElement('div');
        card.className = 'req-card';
        card.innerHTML = `
          <div class="req-top">
            <span class="req-name">${escapeHtml(r.name) || '(未填姓名)'}</span>
            <span class="req-date">請假日期:${escapeHtml(r.date)}</span>
          </div>
          <p class="req-reason">${escapeHtml(r.reason) || '(未填寫原因)'}</p>
          <p class="req-meta">送出時間:${fmtTime(r.submittedAt)}</p>
          <div class="req-actions">
            <button class="btn-approve" data-id="${escapeHtml(r.id)}" data-action="approve">核准</button>
            <button class="btn-reject" data-id="${escapeHtml(r.id)}" data-action="reject">婉拒</button>
          </div>`;
        pendingList.appendChild(card);
      });
    }

    historyList.innerHTML = '';
    if(history.length === 0){
      historyList.innerHTML = '<div class="empty">尚無審核紀錄</div>';
    }else{
      history.slice(0, 30).forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        const tag = r.status === 'approved' ? '<span class="tag approved">已核准</span>' : '<span class="tag rejected">已婉拒</span>';
        item.innerHTML = `
          <div class="top">
            <span><span class="name">${escapeHtml(r.name) || '(未填姓名)'}</span> · ${escapeHtml(r.date)}</span>
            ${tag}
          </div>
          <div>${escapeHtml(r.reason) || '(未填寫原因)'}</div>
          ${r.reviewNote ? `<div class="history-note">審核備註:${escapeHtml(r.reviewNote)}</div>` : ''}`;
        historyList.appendChild(item);
      });
    }

    document.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', onAction));
  }catch(e){
    pendingList.innerHTML = `<div class="empty">載入失敗:${escapeHtml(e.message)}</div>`;
    historyList.innerHTML = '';
  }
}

async function onAction(e){
  const id = e.currentTarget.dataset.id;
  const action = e.currentTarget.dataset.action;
  let reviewNote = '';
  if(action === 'reject'){
    reviewNote = prompt('（選填）填寫婉拒原因,會顯示給申請人看:', '') || '';
  }
  try{
    await api('/api/admin/review', {
      method: 'POST',
      body: JSON.stringify({ id, action, reviewNote })
    });
    await render();
  }catch(e){
    alert('操作失敗:' + e.message);
  }
}

document.getElementById('refreshBtn').addEventListener('click', render);
render();
</script>
</body>
</html>
